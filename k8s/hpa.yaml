# HorizontalPodAutoscaler: agrega o quita réplicas según el uso de CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: exoplanet-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: exoplanet-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50     # Si el CPU promedio pasa de 50 % del request, escala
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 # Espera 1 min sin carga antes de quitar réplicas
